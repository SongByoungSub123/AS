<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>A/S 접수 양식</title>
<style>
body{font-family:Arial,'Malgun Gothic',sans-serif;background:#f4f6f8;margin:0;padding:35px;color:#222}.box{max-width:1000px;margin:auto;background:white;padding:35px;border-radius:14px;box-shadow:0 3px 18px #0002}h1{margin:0 0 8px}p{color:#777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.full{grid-column:1/-1}.sec{border:1px solid #ddd;border-radius:10px;padding:18px;margin-top:20px}label{display:block;font-weight:bold;margin:8px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd2d9;border-radius:7px;font-size:14px}textarea{height:110px}.upload{border:2px dashed #ccd2d9;padding:25px;text-align:center;margin-top:12px}.req{color:#d00}.actions{text-align:right;margin-top:25px}button{padding:12px 25px;border:0;border-radius:7px;margin-left:8px}.submit{background:#1677d2;color:white}.reset{background:#eee}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
<div class="box"><h1>［A/S 접수 양식］</h1><p>아래 항목을 정확하게 입력해 주세요. <b class=req>*</b> 표시는 필수 입력 항목입니다.</p>
<form onsubmit="event.preventDefault();alert('접수 내용이 입력되었습니다.\n현재 버전은 화면 시연용이며 실제 서버 저장 기능은 연결되어 있지 않습니다.');">
<div class=grid>
<div><label>1. 설치장소 <b class=req>*</b></label><input required placeholder="설치장소를 입력해 주세요."></div>
<div><label>2. 설치일자 및 설치업체 <b class=req>*</b></label><input required type=date><input required placeholder="설치업체" style="margin-top:8px"></div>
<div><label>3. 고장발생 일자 <b class=req>*</b></label><input required type=date></div>
<div><label>4. 고장 증상 <b class=req>*</b></label><textarea required placeholder="고장 증상을 자세히 입력해 주세요."></textarea></div>
<div class=full><label>5. 충전 차량 정보 <b class=req>*</b></label><input required placeholder="차량 제조사, 모델명, 연식 등"></div></div>
<div class=sec><h3>6. 1차 고객확인 사항 정보 공유 <b class=req>*</b></h3>
<label>(1) 전원 L,N 정상 결선상태</label><select><option>선택</option><option>정상</option><option>비정상</option></select>
<label>(2) 대기전압 / 충전시 전압</label><div class=grid><input placeholder="대기전압 (V)"><input placeholder="충전시 전압 (V)"></div>
<label>(3) 자동차 최근 OTA 진행유무</label><select><option>선택</option><option>진행함</option><option>진행 안함</option><option>확인 불가</option></select>
<label>(4) 동일사양 타 충전기 진행유무</label><select><option>선택</option><option>정상</option><option>동일증상 발생</option><option>확인 불가</option></select>
<label>(5) 모자분리 설치 유무</label><select><option>선택</option><option>설치됨</option><option>설치 안됨</option></select></div>
<div class=grid><div class=sec><h3>7. <b class=req>[필수]</b> 제품 사진</h3><p>제품 내부, 외부, 제조명판 및 시리얼 사진</p><div class=upload><input required type=file accept="image/*" multiple></div></div>
<div class=sec><h3>8. <b class=req>[필수]</b> 고장 동영상</h3><p class=req>처음부터 오류까지의 영상으로 제공 바랍니다.</p><div class=upload><input required type=file accept="video/*"></div></div></div>
<div class=actions><button type=reset class=reset>초기화</button><button class=submit>✈ 접수하기</button></div>
</form></div>
