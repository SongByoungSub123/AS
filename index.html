<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>유플러스아이티 A/S 접수</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,"Malgun Gothic",sans-serif;background:#f4f6f8;margin:0;color:#222}
.box{max-width:900px;margin:24px auto;background:#fff;padding:28px;border-radius:14px;box-shadow:0 3px 18px #0002}
h1{margin:0 0 8px;font-size:28px}.sub{color:#777;margin-bottom:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}
.sec{border:1px solid #ddd;border-radius:10px;padding:18px;margin-top:20px}
h2{font-size:18px;margin:0 0 16px}label{display:block;font-weight:700;margin:8px 0}
input,textarea,select{width:100%;padding:11px;border:1px solid #ccd2d9;border-radius:7px;font-size:14px;background:#fff}
textarea{min-height:110px;resize:vertical}.req{color:#d00}
small{color:#777}.notice{background:#f8fafc;padding:12px;border-radius:8px;margin-top:10px;font-size:13px;line-height:1.6}
.actions{text-align:right;margin-top:25px}button{padding:13px 25px;border:0;border-radius:7px;font-size:15px;cursor:pointer}
.submit{background:#1677d2;color:white}.reset{background:#eee;margin-right:8px}
button:disabled{opacity:.6;cursor:not-allowed}
#status{display:none;margin-top:20px;padding:16px;border-radius:8px;text-align:center;font-weight:700}
.ok{display:block!important;background:#eaf7ee;color:#176b35}.err{display:block!important;background:#fff0f0;color:#a40000}
.progress{display:none;color:#1677d2;margin-top:12px;text-align:center}
.modal {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  justify-content: center;
  align-items: center;
}

.modal-box {
  width: 280px;
  background: white;
  border-radius: 16px;
  padding: 30px 20px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.modal-box p {
  margin: 6px 0;
  font-size: 15px;
}

.loading-spinner {
  width: 40px;
  height: 40px;
  margin: 0 auto 20px;
  border: 4px solid #eee;
  border-top: 4px solid #1677d2;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  100% {
    transform: rotate(360deg);
  }
}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.box{margin:0;border-radius:0;padding:20px}}
.success-modal {
  display: none;
  position: fixed;
  z-index: 10000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  justify-content: center;
  align-items: center;
}

.success-modal-box {
  width: 320px;
  max-width: 90%;
  background: white;
  border-radius: 16px;
  padding: 30px 20px 24px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
}

.success-icon {
  width: 54px;
  height: 54px;
  margin: 0 auto 15px;
  border-radius: 50%;
  background: #eaf7ee;
  color: #176b35;
  font-size: 32px;
  font-weight: 700;
  line-height: 54px;
}

.success-modal-box h3 {
  margin: 0 0 12px;
  font-size: 19px;
  color: #176b35;
}

.success-modal-box p {
  margin: 0 0 22px;
  font-size: 15px;
  line-height: 1.6;
  color: #555;
}

.success-modal-box button {
  width: 100%;
  padding: 12px;
  border: 0;
  border-radius: 8px;
  background: #1677d2;
  color: white;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.error-modal {
  display: none;
  position: fixed;
  z-index: 10001;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  justify-content: center;
  align-items: center;
}

.error-modal-box {
  width: 320px;
  max-width: 90%;
  background: white;
  border-radius: 16px;
  padding: 30px 20px 24px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
}

.error-icon {
  width: 54px;
  height: 54px;
  margin: 0 auto 15px;
  border-radius: 50%;
  background: #fdeaea;
  color: #d93025;
  font-size: 32px;
  font-weight: 700;
  line-height: 54px;
}

.error-modal-box h3 {
  margin: 0 0 12px;
  font-size: 19px;
  color: #d93025;
}

.error-modal-box p {
  margin: 0 0 22px;
  font-size: 15px;
  line-height: 1.6;
  color: #555;
}

.error-modal-box button {
  width: 100%;
  padding: 12px;
  border: 0;
  border-radius: 8px;
  background: #1677d2;
  color: white;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="box">
<h1>［유플러스아이티 A/S 접수］</h1>
<div class="sub">A/S 접수를 위해 아래 내용을 작성해 주세요. <span class="req">*</span> 표시는 필수 항목입니다.</div>

<form id="asForm">
<div class="grid">
<div><label>1. CPO(판매업체)명 <span class="req">*</span></label><input id="cpoName" required placeholder="CPO명을 입력해 주세요.(모를경우 '모름'으로 입력)"></div>
<div><label>2. 설치장소 <span class="req">*</span></label><input id="installationPlace" required placeholder="설치장소를 입력해 주세요."></div>
<div><label>3. 설치일자 및 설치업체 <span class="req">*</span></label><input id="installationDate" required type="date"><input id="installationCompany" required placeholder="설치업체" style="margin-top:8px"></div>
<div><label>4. 고장발생 일자 <span class="req">*</span></label><input id="failureDate" required type="date"></div>
<div><label>5. 충전기 S/N(충전기 일련번호) <span class="req">*</span></label><input id="serialNumber" required placeholder="충전기 S/N을 입력해 주세요."></div>
<div><label>6. 고객 전화번호 <span class="req">*</span></label><input id="customerPhone" required type="tel" placeholder="고객 전화번호를 입력해 주세요."></div>
<div class="full"><label>7. 고장 증상 <span class="req">*</span></label><textarea id="failureSymptom" required placeholder="고장 증상을 자세히 입력해 주세요."></textarea></div>
<div><label>8. 충전 차량 정보 <span class="req">*</span></label><input id="vehicleInfo" required placeholder="차량 제조사 / 모델명 / 연식 등"></div>
</div>

<div class="sec">
<h2>9. 1차 고객확인 사항 정보 공유</h2>
<label>(1) 전원 L,N 정상 결선상태</label>
<select id="lnConnection"><option value="">선택</option><option>정상</option><option>비정상</option><option>확인 불가</option></select>

<label>(2) 대기전압 / 충전시 전압</label>
<div class="grid"><input id="standbyVoltage" placeholder="대기전압 (V)"><input id="chargingVoltage" placeholder="충전시 전압 (V)"></div>

<label>(3) 자동차 최근 OTA 진행유무</label>
<select id="ota"><option value="">선택</option><option>진행함</option><option>진행 안함</option><option>확인 불가</option></select>

<label>(4) 동일사양 타 충전기 진행유무</label>
<select id="otherCharger"><option value="">선택</option><option>정상 충전</option><option>동일증상 발생</option><option>확인 불가</option></select>

<label>(5) 모자분리 설치 유무</label>
<select id="separation"><option value="">선택</option><option>설치됨</option><option>설치 안됨</option><option>확인 불가</option></select>
</div>

<div class="sec">
<h2>10. 고장 증상 사진 및 동영상 첨부 확인</h2>
<label style="display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;">
  <input type="checkbox" id="attachmentConfirm" required style="width:auto;">
  [필수] 고장 증상 사진과 동영상을 필히 첨부해주세요.
</label>
</div>

<div class="actions">
<button type="reset" class="reset">초기화</button>
<button type="submit" class="submit" id="submitBtn">✈ A/S 접수하기</button>
</div>
<div class="modal" id="progressModal">
  <div class="modal-box">
    <div class="loading-spinner"></div>
    <p>접수 내용을 전송하고 있습니다.</p>
    <p>잠시만 기다려 주세요.</p>
  </div>
</div>
<div id="status"></div>
<div class="error-modal" id="errorModal">
  <div class="error-modal-box">
    <div class="error-icon">!</div>
    <h3>접수 중 오류가 발생했습니다.</h3>
    <p>
      일시적인 오류가 발생했습니다.<br>
      잠시 후 다시 시도해주세요.
    </p>
    <button type="button" id="errorConfirmBtn">확인</button>
  </div>
</div>
<div class="success-modal" id="successModal">
  <div class="success-modal-box">
    <div class="success-icon">✓</div>
    <h3>A/S 접수가 완료되었습니다.</h3>
    <p>
      접수번호: <strong id="successReceiptNo"></strong><br><br>
      담당자가 내용을 확인 후<br>
      연락드리겠습니다.
    </p>
    <button type="button" id="successConfirmBtn">확인</button>
  </div>
</div>
</form>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzNHR8iAy8itkqG0Sdt5cJBcJZQmPUyE8KNbE1EmEf-4F97JRMWmctW_Z-TUZkcuJg/exec";



async function postJson(payload) {
  // Apps Script 웹앱의 교차 출처 제한을 피하기 위해 no-cors 사용.
  // 서버에서는 요청을 정상적으로 처리한다.
  return fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(payload)
  });
}

function getReceiptNo(uploadId) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "receiptCallback_" +
      Date.now() +
      "_" +
      Math.random().toString(36).slice(2, 8);

    const script = document.createElement("script");

    const timeout = setTimeout(() => {

      delete window[callbackName];

      script.remove();

      reject(new Error("접수번호 조회 시간이 초과되었습니다."));

    }, 10000);

    window[callbackName] = function(result) {

      clearTimeout(timeout);

      delete window[callbackName];

      script.remove();

      if (result.success) {

        resolve(result.receiptNo);

      } else {

        reject(
          new Error(
            result.error || "접수번호를 가져오지 못했습니다."
          )
        );

      }

    };

    script.src =
      SCRIPT_URL +
      "?uploadId=" +
      encodeURIComponent(uploadId) +
      "&callback=" +
      encodeURIComponent(callbackName);

    document.body.appendChild(script);

  });

}

document.getElementById("asForm").addEventListener("submit", async function(e) {
  e.preventDefault();

const btn = document.getElementById("submitBtn");
const progressModal = document.getElementById("progressModal");
const status = document.getElementById("status");

btn.disabled = true;
progressModal.style.display = "flex";
  status.className = "";
  status.style.display = "none";

  const uploadId = "AS-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
console.log("uploadId:", uploadId);

  try {
    // 먼저 접수 데이터(텍스트)를 서버에 전달한다.
    await postJson({
      action: "create",
      uploadId,
      installationPlace: document.getElementById("installationPlace").value,
      installationDate: document.getElementById("installationDate").value,
      installationCompany: document.getElementById("installationCompany").value,
      serialNumber: document.getElementById("serialNumber").value,
      customerPhone: document.getElementById("customerPhone").value,
      failureDate: document.getElementById("failureDate").value,
      failureSymptom: document.getElementById("failureSymptom").value,
      vehicleInfo: document.getElementById("vehicleInfo").value,
      lnConnection: document.getElementById("lnConnection").value,
      standbyVoltage: document.getElementById("standbyVoltage").value,
      chargingVoltage: document.getElementById("chargingVoltage").value,
      ota: document.getElementById("ota").value,
      otherCharger: document.getElementById("otherCharger").value,
      separation: document.getElementById("separation").value,
      cpoName: document.getElementById("cpoName").value
    });


    progressModal.style.display = "none";

const successModal = document.getElementById("successModal");
const receiptNo = await getReceiptNo(uploadId);
document.getElementById("successReceiptNo").textContent = receiptNo;
successModal.style.display = "flex";

document.getElementById("successConfirmBtn").addEventListener("click", function() {
  document.getElementById("successModal").style.display = "none";
});

    document.getElementById("asForm").reset();

  } catch (err) {
    progressModal.style.display = "none";

  const errorModal = document.getElementById("errorModal");
  errorModal.style.display = "flex";

    console.error(err);
  } finally {
    btn.disabled = false;
  }

document.getElementById("errorConfirmBtn").addEventListener("click", function() {
  document.getElementById("errorModal").style.display = "none";
});

});
</script>
</body>
</html>
